name: Lint

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    checks: write
    contents: write

jobs:
    run-linters:
        name: Run linters
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v1
              with:
                  node-version: 24

            - name: Install Node.js dependencies
              run: npm install

            - name: Reset any package-lock changes
              run: git checkout -- package-lock.json

            - name: Run linters
              uses: wearerequired/lint-action@v2
              with:
                  eslint: true
